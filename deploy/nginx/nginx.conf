# nginx.conf — Reverse Proxy raíz para EC2
# Rutas:
#   /                → frontend Angular (contenedor: frontend:80)
#   /api/            → backend Spring Boot (contenedor: backend:8080)
#   /ws-politicas    → WebSocket backend (contenedor: backend:8080)
#   /onlyoffice/     → OnlyOffice Document Server (contenedor: onlyoffice:80)
#   /ia/             → IA General FastAPI (contenedor: ia-service:8000) [acceso directo opcional]
#   /ia-dl/          → IA Deep Learning FastAPI (contenedor: ia-deep-learning-service:8010) [acceso directo opcional]

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Aumentar tamaño de body para uploads de archivos grandes (videos, docs)
    client_max_body_size 512M;

    # Timeouts para servicios IA que pueden tardar
    proxy_connect_timeout   60s;
    proxy_send_timeout      120s;
    proxy_read_timeout      300s;  # 5 minutos para modelos DL

    # ─── Upstreams ──────────────────────────────────────────────────────────
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:8080;
    }

    upstream ia_upstream {
        server ia-service:8000;
    }

    upstream ia_dl_upstream {
        server ia-deep-learning-service:8010;
    }

    upstream onlyoffice_upstream {
        server onlyoffice:80;
    }

    # ─── Server HTTP (puerto 80) ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;  # Acepta cualquier host (IP pública del EC2)

        # Para HTTPS con Certbot (paso posterior):
        # listen 443 ssl;
        # ssl_certificate /etc/letsencrypt/live/DOMINIO/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

        # ── Backend Spring Boot — /api/ ─────────────────────────────────────
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # ── WebSocket Spring Boot — /ws-politicas ───────────────────────────
        location = /ws-politicas {
            proxy_pass http://backend_upstream/ws-politicas;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location /ws-politicas/ {
            proxy_pass http://backend_upstream/ws-politicas/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # ── OnlyOffice Document Server — /onlyoffice/ ────────────────────────
        # OnlyOffice requiere configuración especial para WebSockets y headers
        location /onlyoffice/ {
            proxy_pass http://onlyoffice_upstream/;
            proxy_http_version 1.1;

            # Headers estándar
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (OnlyOffice lo requiere)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers adicionales requeridos por OnlyOffice
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # ── IA General FastAPI — /ia/ (acceso directo opcional) ──────────────
        location /ia/ {
            proxy_pass http://ia_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ── IA Deep Learning FastAPI — /ia-dl/ (acceso directo opcional) ─────
        location /ia-dl/ {
            proxy_pass http://ia_dl_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ── Frontend Angular — / (todo lo demás) ─────────────────────────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

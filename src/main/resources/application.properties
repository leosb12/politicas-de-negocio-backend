spring.application.name=politicas-de-negocio
server.port=${PORT:${SERVER_PORT:8080}}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

# MongoDB Atlas (externa) - credenciales solo via variables de entorno
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGODB_URI:}}}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:${SPRING_DATA_MONGODB_DATABASE:${MONGODB_DATABASE:politicas_negocio_db}}}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.database=${spring.mongodb.database}
spring.data.mongodb.auto-index-creation=true

# CORS - En produccion usar IP/dominio publico del EC2
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.collab.snapshot-interval-ms=5000

# Storage de adjuntos (s3 recomendado para produccion)
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:uploads}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:${aws.s3.bucket:}}
app.storage.s3.region=${APP_STORAGE_S3_REGION:${aws.region:sa-east-1}}
app.storage.s3.key-prefix=${APP_STORAGE_S3_KEY_PREFIX:adjuntos/}

# AWS
aws.region=${AWS_REGION:${APP_STORAGE_S3_REGION:sa-east-1}}
aws.s3.bucket=${S3_BUCKET:${AWS_S3_BUCKET:${APP_STORAGE_S3_BUCKET:}}}
aws.dynamodb.document-repositories-table=DocumentRepositories

# Notificaciones Firebase
app.notifications.firebase.enabled=${APP_NOTIFICATIONS_FIREBASE_ENABLED:false}
app.notifications.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.notifications.firebase.service-account-path=${FIREBASE_CREDENTIALS_PATH:${FIREBASE_SERVICE_ACCOUNT_PATH:${GOOGLE_APPLICATION_CREDENTIALS:}}}
app.notifications.firebase.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}

# Microservicio IA General
app.ia.base-url=${IA_SERVICE_URL:${APP_IA_BASE_URL:http://localhost:8000}}
app.ia.timeout-ms=${APP_IA_TIMEOUT_MS:30000}

# Microservicio IA Deep Learning
app.ia.deep-learning-url=${IA_DEEP_LEARNING_URL:http://localhost:8010}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:}

# URLs publicas
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.payments.stripe.success-url=${APP_PAYMENTS_STRIPE_SUCCESS_URL:${app.public-base-url}/pagos/stripe/success?session_id={CHECKOUT_SESSION_ID}}
app.payments.stripe.cancel-url=${APP_PAYMENTS_STRIPE_CANCEL_URL:${app.public-base-url}/pagos/cancelado}

# PayPal
app.payments.paypal.base-url=${APP_PAYMENTS_PAYPAL_BASE_URL:https://www.paypal.com/cgi-bin/webscr}
app.payments.paypal.business-email=${APP_PAYMENTS_PAYPAL_BUSINESS_EMAIL:}
app.payments.paypal.return-url=${APP_PAYMENTS_PAYPAL_RETURN_URL:${app.public-base-url}/pagos/paypal/retorno}
app.payments.paypal.cancel-url=${APP_PAYMENTS_PAYPAL_CANCEL_URL:${app.public-base-url}/pagos/cancelado}
app.payments.demo.manual-paypal-approval-enabled=${APP_PAYMENTS_DEMO_MANUAL_PAYPAL_APPROVAL_ENABLED:true}

# Seed data
app.seed.politicas-wifi.enabled=${APP_SEED_POLITICAS_WIFI_ENABLED:false}

# Correo SMTP - solo via variables de entorno, sin valores quemados
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Limite de tamano de archivos cargados (videos, etc.)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# OnlyOffice Document Server
# En Docker Compose: http://onlyoffice:80
# En local: http://localhost:8082
onlyoffice.document-server-url=${ONLYOFFICE_DOCUMENT_SERVER_URL:http://localhost:8082}
onlyoffice.public-url=${ONLYOFFICE_PUBLIC_URL:${onlyoffice.document-server-url}}
# callback-base-url debe ser la URL donde OnlyOffice puede llamar de vuelta al backend
# En Docker Compose: http://backend:8080
# En local con Docker: http://host.docker.internal:8080
onlyoffice.callback-base-url=${ONLYOFFICE_CALLBACK_BASE_URL:http://host.docker.internal:8080}
onlyoffice.source-public-access-enabled=${ONLYOFFICE_SOURCE_PUBLIC_ACCESS_ENABLED:true}
onlyoffice.jwt-enabled=${ONLYOFFICE_JWT_ENABLED:false}
onlyoffice.jwt-secret=${ONLYOFFICE_JWT_SECRET:}

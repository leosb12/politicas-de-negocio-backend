spring.application.name=politicas-de-negocio
server.port=${PORT:${SERVER_PORT:8080}}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGODB_URI}}}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:${SPRING_DATA_MONGODB_DATABASE:${MONGODB_DATABASE:politicas_negocio_db}}}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.database=${spring.mongodb.database}
spring.data.mongodb.auto-index-creation=true
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
app.collab.snapshot-interval-ms=5000

app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:uploads}

app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:mi-bucket}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}
app.storage.s3.key-prefix=${APP_STORAGE_S3_KEY_PREFIX:adjuntos/}

app.notifications.firebase.enabled=${APP_NOTIFICATIONS_FIREBASE_ENABLED:false}
app.notifications.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.notifications.firebase.service-account-path=${FIREBASE_CREDENTIALS_PATH:${FIREBASE_SERVICE_ACCOUNT_PATH:${GOOGLE_APPLICATION_CREDENTIALS:}}}
app.notifications.firebase.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}

app.ia.base-url=${APP_IA_BASE_URL:http://localhost:8001}
app.ia.timeout-ms=${APP_IA_TIMEOUT_MS:30000}

stripe.secret-key=${STRIPE_SECRET_KEY:}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://192.168.1.16:8080}
app.payments.stripe.success-url=${APP_PAYMENTS_STRIPE_SUCCESS_URL:${app.public-base-url}/pagos/stripe/success?session_id={CHECKOUT_SESSION_ID}}
app.payments.stripe.cancel-url=${APP_PAYMENTS_STRIPE_CANCEL_URL:${app.public-base-url}/pagos/cancelado}

app.payments.paypal.base-url=${APP_PAYMENTS_PAYPAL_BASE_URL:https://www.paypal.com/cgi-bin/webscr}
app.payments.paypal.business-email=${APP_PAYMENTS_PAYPAL_BUSINESS_EMAIL:leonardoserrate9@gmail.com}

app.payments.paypal.return-url=${APP_PAYMENTS_PAYPAL_RETURN_URL:${app.public-base-url}/pagos/paypal/retorno}
app.payments.paypal.cancel-url=${APP_PAYMENTS_PAYPAL_CANCEL_URL:${app.public-base-url}/pagos/cancelado}

app.payments.demo.manual-paypal-approval-enabled=${APP_PAYMENTS_DEMO_MANUAL_PAYPAL_APPROVAL_ENABLED:true}
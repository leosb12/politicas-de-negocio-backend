# docker-compose.yml — Despliegue EC2 completo
# Región: sa-east-1 (São Paulo) | Instancia: t3a.xlarge (16 GiB / 4 vCPU)
#
# Uso:
#   cp .env.production.example .env
#   # Editar .env con valores reales
#   docker compose build
#   docker compose up -d
#
# Orden de levantamiento recomendado (gestionado por depends_on):
#   onlyoffice → ia-service → ia-deep-learning-service → backend → frontend → nginx

name: politicas-negocio-prod

services:

  # ─── OnlyOffice Document Server ───────────────────────────────────────────
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-false}
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      # Aumentar workers para documentos grandes
      NGINX_WORKER_PROCESSES: 1
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
    networks:
      - app-network
    # OnlyOffice usa el puerto 80 internamente
    # NO exponemos el puerto al host; Nginx lo proxea internamente

  # ─── Microservicio IA General (FastAPI) ───────────────────────────────────
  ia-service:
    build:
      context: ../../ia-service
      dockerfile: Dockerfile
    image: politicas-ia-service:prod
    container_name: ia-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_NAME: ia-service
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_USER_GUIDE_MODEL: ${DEEPSEEK_USER_GUIDE_MODEL:-deepseek-chat}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-0}
      DEEPSEEK_TEMPERATURE: ${DEEPSEEK_TEMPERATURE:-0.2}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      # En Docker Compose el deep learning service es accesible por su nombre
      IA_DEEP_LEARNING_SERVICE_URL: http://ia-deep-learning-service:8010
    networks:
      - app-network

  # ─── Microservicio IA Deep Learning (FastAPI + TensorFlow) ───────────────
  ia-deep-learning-service:
    build:
      context: ../../ia-deep-learning-service
      dockerfile: Dockerfile
    image: politicas-ia-dl-service:prod
    container_name: ia-deep-learning-service
    restart: unless-stopped
    environment:
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      # El backend es accesible por su nombre de servicio Docker
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_DATASET_URL: http://backend:8080/api/deep-learning/dataset/rutas/export/csv
      MODEL_DIR: app/modules/predicciones/models
      DATASET_DIR: app/modules/predicciones/datasets
    volumes:
      # Persistir modelos entrenados para no re-entrenar en cada restart
      - dl_models:/app/app/modules/predicciones/models
      - dl_datasets:/app/app/modules/predicciones/datasets
    networks:
      - app-network
    depends_on:
      - onlyoffice

  # ─── Backend Spring Boot ──────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: politicas-backend:prod
    container_name: backend
    restart: unless-stopped
    environment:
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # MongoDB Atlas (externa)
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set}
      SPRING_MONGODB_URI: ${MONGODB_URI}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-politicas_negocio_db}
      SPRING_MONGODB_DATABASE: ${MONGODB_DATABASE:-politicas_negocio_db}
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE:-politicas_negocio_db}
      # CORS — IP pública del EC2 o dominio
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*}
      # Storage S3 (recomendado para produccion)
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-s3}
      APP_STORAGE_S3_BUCKET: ${S3_BUCKET:-politicas-document-repositories-leonardo}
      APP_STORAGE_S3_REGION: ${AWS_REGION:-sa-east-1}
      APP_STORAGE_S3_KEY_PREFIX: ${APP_STORAGE_S3_KEY_PREFIX:-document-repositories/}
      AWS_S3_BUCKET: ${S3_BUCKET:-politicas-document-repositories-leonardo}
      AWS_S3_REGION: ${AWS_REGION:-sa-east-1}
      # AWS Credentials (alternativa: usar IAM Instance Role en EC2)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-sa-east-1}
      # Firebase
      APP_NOTIFICATIONS_FIREBASE_ENABLED: ${APP_NOTIFICATIONS_FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      # Correo SMTP
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # URLs públicas (reemplazar con IP o dominio del EC2)
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      APP_PAYMENTS_DEMO_MANUAL_PAYPAL_APPROVAL_ENABLED: ${APP_PAYMENTS_DEMO_MANUAL_PAYPAL_APPROVAL_ENABLED:-true}
      # Microservicios IA — nombres de servicio Docker
      IA_SERVICE_URL: http://ia-service:8000
      IA_DEEP_LEARNING_URL: http://ia-deep-learning-service:8010
      ONLYOFFICE_DOCUMENT_SERVER_URL: http://onlyoffice:80
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-https://parcial.leonardoserrate.xyz/onlyoffice}
      # OnlyOffice llama de vuelta al backend vía Nginx o IP interna
      # En EC2: usar http://backend:8080 (red interna Docker)
      ONLYOFFICE_CALLBACK_BASE_URL: ${ONLYOFFICE_CALLBACK_BASE_URL:-http://backend:8080}
      ONLYOFFICE_JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-false}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ONLYOFFICE_SOURCE_PUBLIC_ACCESS_ENABLED: "true"
      # Seed
      APP_SEED_POLITICAS_WIFI_ENABLED: ${APP_SEED_POLITICAS_WIFI_ENABLED:-false}
    networks:
      - app-network
    depends_on:
      - ia-service
      - ia-deep-learning-service
      - onlyoffice

  # ─── Frontend Angular (servido con Nginx interno) ─────────────────────────
  frontend:
    build:
      context: ../../politicas-negocio-web
      dockerfile: Dockerfile
    image: politicas-frontend:prod
    container_name: frontend
    restart: unless-stopped
    environment:
      # Vacío = usar rutas relativas (/api, /ws-politicas) via proxy Nginx raíz
      # Si se usa dominio separado: API_BASE_URL=https://api.midominio.com
      API_BASE_URL: ${API_BASE_URL:-}
      # FRONTEND_API_UPSTREAM no se necesita en producción (Nginx raíz proxea /api)
      FRONTEND_API_UPSTREAM: backend:8080
      # Firebase Web SDK (inyectadas en runtime-config.js)
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_WEB_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:-}
      FIREBASE_WEB_PROJECT_ID: ${FIREBASE_WEB_PROJECT_ID:-}
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:-}
      FIREBASE_WEB_MESSAGING_SENDER_ID: ${FIREBASE_WEB_MESSAGING_SENDER_ID:-}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
      FIREBASE_WEB_MEASUREMENT_ID: ${FIREBASE_WEB_MEASUREMENT_ID:-}
      FIREBASE_WEB_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}
    networks:
      - app-network
    depends_on:
      - backend

  # ─── Nginx — Reverse Proxy Raíz ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Puerto 443 se habilitará con Certbot (HTTPS - paso posterior)
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Volumen para certificados SSL (Certbot - paso posterior)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
      - ia-service
      - ia-deep-learning-service
      - onlyoffice

# ─── Redes ────────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ─── Volúmenes ────────────────────────────────────────────────────────────────
volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_cache:
  onlyoffice_fonts:
  dl_models:
  dl_datasets:

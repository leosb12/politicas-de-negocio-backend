services:
  app:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: politicas-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set in .env}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set in .env}
      SPRING_MONGODB_DATABASE: ${MONGODB_DATABASE:-politicas_negocio_db}
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE:-politicas_negocio_db}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
      APP_STORAGE_S3_KEY_PREFIX: ${APP_STORAGE_S3_KEY_PREFIX:-adjuntos/}
      APP_STORAGE_LOCAL_BASE_PATH: /app/uploads
      APP_NOTIFICATIONS_FIREBASE_ENABLED: ${APP_NOTIFICATIONS_FIREBASE_ENABLED:-true}
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data:
